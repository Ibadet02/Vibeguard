<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeGuard: See what your AI left exposed</title>
<meta name="description" content="Paste your repo and VibeGuard x-rays the app you built with AI, revealing the security holes hiding under the surface in plain English, with the exact fixes.">
<meta property="og:title" content="VibeGuard: Security x-ray for AI-built apps">
<meta property="og:description" content="Your app looks fine. We see what's underneath. Paste your repo for a free scan.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=hanken-grotesk@400,500,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='5' width='24' height='22' rx='5' fill='none' stroke='%232FE4C7' stroke-width='2'/%3E%3Cline x1='4' y1='16' x2='28' y2='16' stroke='%232FE4C7' stroke-width='2'/%3E%3Ccircle cx='21' cy='11' r='2.4' fill='%23FF5C7A'/%3E%3C/svg%3E">
<style>
  :root {
    --ground: #0A0D15;
    --surface: #121826;
    --line: #232E44;
    --line-2: #33415C;
    --ink: #EAEFF9;
    --muted: #95A0B8;
    --faint: #5A6479;
    --cyan: #2FE4C7;
    --cyan-2: #6BF2DC;
    --crit: #FF5C7A;
    --display: "Clash Display", -apple-system, system-ui, sans-serif;
    --body: "Hanken Grotesk", -apple-system, system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--body); line-height: 1.6; font-size: 17px;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
  }
  /* ambient grid + glow, centered behind the input */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 46px 46px; opacity: 0.26;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, #000 20%, transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 42%, #000 20%, transparent 72%);
  }
  body::after {
    content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -60%);
    z-index: 0; pointer-events: none;
    width: 70vw; height: 70vw; max-width: 820px; max-height: 820px;
    background: radial-gradient(circle, rgba(47,228,199,0.16), rgba(47,228,199,0) 60%);
    filter: blur(20px);
  }

  a { color: inherit; text-decoration: none; }

  .top { position: relative; z-index: 1; display: flex; justify-content: center; padding: 28px 24px 0; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }

  main {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 24px 64px; gap: 0;
  }
  h1 {
    font-family: var(--display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.04;
    font-size: clamp(2.1rem, 5.4vw, 3.5rem); margin: 0 0 18px; text-wrap: balance;
  }
  h1 .u { color: var(--cyan); }
  .lead { color: var(--muted); font-size: clamp(1.02rem, 1.6vw, 1.18rem); max-width: 48ch; margin: 0 auto 36px; }

  form.xray {
    display: flex; gap: 10px; width: 100%; max-width: 600px; padding: 8px; border-radius: 18px;
    background: rgba(47,228,199,0.055); border: 1px solid rgba(47,228,199,0.28);
    box-shadow: 0 0 0 4px rgba(47,228,199,0.06), 0 24px 60px -24px rgba(47,228,199,0.45);
    animation: ctaGlow 3.2s ease-in-out infinite;
  }
  form.xray input {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: 1.05rem; color: var(--ink);
    background: rgba(10,13,21,0.55); border: 1px solid transparent; border-radius: 12px; padding: 18px;
    transition: box-shadow .2s;
  }
  form.xray input::placeholder { color: var(--faint); }
  form.xray input:focus { outline: none; box-shadow: 0 0 0 3px rgba(47,228,199,0.22); }
  .btn {
    font-family: var(--body); font-weight: 700; font-size: 1.05rem; border: 0; cursor: pointer;
    border-radius: 12px; padding: 18px 30px; background: var(--cyan); color: #04120F;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
    transition: transform .15s ease, box-shadow .25s ease, background .2s;
  }
  .btn:hover { background: var(--cyan-2); transform: translateY(-1px); box-shadow: 0 10px 34px rgba(47,228,199,0.3); }
  .microcopy { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-top: 20px; letter-spacing: 0.02em; }

  footer { position: relative; z-index: 1; text-align: center; padding: 18px 24px 30px; color: var(--faint); font-size: 13px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--ink); }

  @keyframes ctaGlow {
    0%, 100% { box-shadow: 0 0 0 4px rgba(47,228,199,0.05), 0 24px 60px -24px rgba(47,228,199,0.35); }
    50% { box-shadow: 0 0 0 5px rgba(47,228,199,0.12), 0 26px 66px -22px rgba(47,228,199,0.55); }
  }
  @media (max-width: 540px) {
    form.xray { flex-direction: column; }
    .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    form.xray { animation: none; }
  }
</style>
</head>
<body>
  <div class="top">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" width="26" height="26">
        <rect x="4" y="5" width="24" height="22" rx="5" fill="none" stroke="#2FE4C7" stroke-width="2"/>
        <line x1="4" y1="16" x2="28" y2="16" stroke="#2FE4C7" stroke-width="2"/>
        <circle cx="21" cy="11" r="2.4" fill="#FF5C7A"/>
      </svg>
      VibeGuard
    </a>
  </div>

  <main>
    <h1>Your app looks fine.<br>We see what's <span class="u">underneath.</span></h1>
    <p class="lead">Paste your repo. VibeGuard x-rays the app you built with AI and shows the security holes in plain English, with the exact fixes.</p>
    <form class="xray" id="xrayForm">
      <input type="text" name="repo" placeholder="github.com/you/your-app" aria-label="Your repository URL" required autofocus>
      <button type="submit" class="btn">X-ray it free</button>
    </form>
    <p class="microcopy">No sign-up · public repos · we delete your code right after the scan</p>
  </main>

  <footer>
    <a href="https://vibeguard-production-1778.up.railway.app/privacy">Privacy</a> ·
    <a href="https://vibeguard-production-1778.up.railway.app/terms">Terms</a>
  </footer>

  <script>
    // Hand the repo off to the live scanner, which auto-starts on ?target=.
    var VG_SCANNER = 'https://vibeguard-production-1778.up.railway.app';
    document.getElementById('xrayForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = (this.repo.value || '').trim();
      if (!v) return;
      window.location.href = VG_SCANNER + '/?target=' + encodeURIComponent(v);
    });
  </script>
</body>
</html>
